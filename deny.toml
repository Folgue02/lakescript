# Checked with `cargo deny check licenses`: only permissive licenses that are
# compatible with Apache-2.0 are allowed for dependencies.
[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # The certificates of `webpki-roots`, used by std/http: a permissive
    # license for data
    "CDLA-Permissive-2.0",
    # `selectors` and `cssparser` from Servo, used by std/html. MPL-2.0 is
    # copyleft only for its own files, which are used without changes
    # *(see ideas/stdlib/planned.md)*
    "MPL-2.0",
]
confidence-threshold = 0.9
