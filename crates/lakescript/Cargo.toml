[package]
name = "lakescript"
description = "The Lakescript language: lexer, parser and interpreter, as a library that other programs can embed"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
crossterm = "0.29.0"
csv = "1.4.0"
ego-tree = "0.11.1"
indexmap = "2.14"
inquire = { version = "0.9.5", default-features = false, features = ["crossterm", "fuzzy"] }
jiff = "0.2"
regex = "1.13"
scraper = { version = "0.29.0", default-features = false, features = ["deterministic"] }
unicode-width = "0.2.3"
ureq = "3.5.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
