[package]
name = "lakescript"
description = "The Lakescript language: lexer, parser and interpreter, as a library that other programs can embed"
version.workspace = true
edition.workspace = true
license.workspace = true

# The modules of the standard library that need big crates. They're all on by
# default, and a program that embeds Lakescript can leave some out *(i.e.
# `lakescript = { version = "...", default-features = false, features = ["dates"] }`)*.
# A script that uses one that was left out is told so.
[features]
default = ["archive", "bundle", "csv", "dates", "html", "http", "terminal"]
# std/archive: zip, tar and tar.gz. Entries say when they changed as dates
archive = ["dep:zip", "dep:tar", "dep:flate2", "dates"]
# Bundles: running a .lkb, and writing one for `ferry bundle`
bundle = ["dep:zip"]
# std/format/csv
csv = ["dep:csv"]
# The dates of std/time, and std/time/zone. `time::now()` is always there
dates = ["dep:jiff"]
# std/html
html = ["dep:scraper", "dep:ego-tree"]
# std/http, with TLS
http = ["dep:ureq"]
# std/terminal
terminal = ["dep:inquire", "dep:crossterm", "dep:unicode-width"]

[dependencies]
crossterm = { version = "0.29.0", optional = true }
csv = { version = "1.4.0", optional = true }
ego-tree = { version = "0.11.1", optional = true }
flate2 = { version = "1.1.11", optional = true }
indexmap = "2.14"
inquire = { version = "0.9.5", default-features = false, features = ["crossterm", "fuzzy"], optional = true }
jiff = { version = "0.2", optional = true }
regex = "1.13"
scraper = { version = "0.29.0", default-features = false, features = ["deterministic"], optional = true }
tar = { version = "0.4.46", default-features = false, optional = true }
unicode-width = { version = "0.2.3", optional = true }
ureq = { version = "3.5.2", optional = true }
zip = { version = "9.8.2", default-features = false, features = ["deflate-flate2"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The Known Folders of Windows, for the user's folders of std/dirs
[target.'cfg(windows)'.dependencies]
dirs = "6.0.0"

[dev-dependencies]
zip = { version = "9.8.2", default-features = false, features = ["deflate-flate2"] }
