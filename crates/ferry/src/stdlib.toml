text = "The last element `$fn` returns `true` for, or `null`"
group = "Searching"

[[modules.items.members]]
kind = "method"
name = "findIndex"
code = "?number findIndex((T) -> bool $fn)"
text = "The position of the first element `$fn` returns `true` for, or `null`"
group = "Searching"

[[modules.items.members]]
kind = "method"
name = "any"
code = "bool any((T) -> bool $fn)"
text = "`true` if `$fn` returns `true` for at least one element"
