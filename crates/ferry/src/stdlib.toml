name = "split"
code = "list<string> split(string $separator, ?number $limit = null)"
text = "Splits at every `$separator`. With `$limit`, makes at most that many parts *(i.e. `'a,b,c'.split(',')` is `['a', 'b', 'c']`, `'a,b,c'.split(',', 2)` is `['a', 'b,c']`)*"
group = "Splitting"

[[modules.items.members]]
kind = "method"
name = "splitMatches"
code = "list<string> splitMatches(regex $pattern, ?number $limit = null)"
text = "Splits at every match of `$pattern` *(i.e. `'a, b;c'.splitMatches(%r\"[,;]\\s*\")` is `['a', 'b', 'c']`)*"
group = "Splitting"

[[modules.items.members]]
kind = "method"
name = "splitOnce"
code = "?list<string> splitOnce(string $separator)"
text = "The part before and the part after the first `$separator`, or `null` if it's not there *(i.e. `'key=a=b'.splitOnce('=')` is `['key', 'a=b']`)*"
group = "Splitting"

[[modules.items.members]]
kind = "method"
name = "lines"
code = "list<string> lines()"
text = "Splits at new lines, `\\n` or `\\r\\n`, without them. A last empty line is ignored *(i.e. `\"a\\nb\\n\".lines()` is `['a', 'b']`)*"
group = "Splitting"

[[modules.items.members]]
kind = "method"
name = "words"
code = "list<string> words()"
text = "Splits at any whitespace, ignoring empty parts *(i.e. `' a  b\\tc '.words()` is `['a', 'b', 'c']`)*"
group = "Splitting"

[[modules.items.members]]
kind = "method"
name = "chars"
code = "list<string> chars()"
text = "Every character as a one-character string *(i.e. `'abc'.chars()` is `['a', 'b', 'c']`)*"
group = "Splitting"

[[modules.items.members]]
kind = "method"
name = "toNumber"
code = "number toNumber()"
text = "Reads a number in any of the literal forms *(i.e. `'42'`, `'-2.5'`, `'0xFF'`, `'1_000'`)*. Whitespace around it is ignored. Throws a `ValueError` otherwise"
group = "Converting"

[[modules.items.members]]
kind = "method"
name = "toBytes"
code = "bytes toBytes()"
text = "The text as bytes, in UTF-8 *(i.e. `'é'.toBytes().length()` is `2`)*. `$b.text()` reads them back"
group = "Converting"

[[modules.items.members]]
kind = "method"
name = "toBool"
code = "bool toBool()"
text = "`'true'` and `'false'`, ignoring case. Throws a `ValueError` otherwise"
group = "Converting"

[[modules.items.members]]
kind = "method"
name = "codePoint"
code = "number codePoint(number $index = 0)"
text = "The Unicode code of the character at `$index` *(i.e. `'A'.codePoint()` is `65`)*"
group = "Converting"

[[modules.items.members]]
kind = "method"
name = "escapeRegex"
code = "string escapeRegex()"
text = "Escapes the characters that mean something in a regex, so it can be matched literally *(i.e. `'1+1'.escapeRegex()` is `'1\\+1'`)*"
group = "Converting"

[[modules.items.members]]
kind = "method"
name = "toString"
code = "string toString()"
text = "The same string"
group = "Converting"

[[modules.items]]
