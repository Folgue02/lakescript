[[modules.items]]
kind = "type"
name = "bytes"
code = "bytes"
text = "Binary data: what files, HTTP bodies and archives hold when it isn't text *(i.e. an image)*. Like a string, a value that doesn't change, compared by its contents with `==` *(see Bytes in [builtin_types](https://github.com/Folgue02/lakescript/blob/master/ideas/language/builtin_types.md))*.\n\n```\nconst $png = %b\"\\x89PNG\\r\\n\\x1a\\n\";\nconst $file = fs::readBytes('logo.png');\nif ($file.startsWith($png)) outln(f\"A PNG of {$file.length().formatBytes()}\");\n\nconst $b = 'héllo'.toBytes();      // UTF-8\noutln($b);                         // <bytes 6 bytes>\noutln($b[0]);                      // 104, a number from 0 to 255\noutln($b[1..3].hex());             // 'c3a9'\noutln($b.text());                  // 'héllo'\n```\n\n- Made with the literal `%b\"...\"`, where characters are written as UTF-8 and `\\xFF` is one byte, with `$text.toBytes()`, `$numbers.toBytes()`, `bytes::fromHex()` and `bytes::fromBase64()` *(see [`std/bytes`](bytes.html))*, and by `fs::readBytes()`, `$response.bytes()` and `$archive.readBytes()`.\n- `$b[$i]` is the byte at `$i`, a number from 0 to 255, or `null` past the end. Negative indexes count from the end. `$b[1..3]` gives bytes.\n- `$a + $b` joins them. `for ($n in $b)` loops over the numbers.\n- They print as how many there are *(i.e. `<bytes 1.2 KB>`)*, since they aren't text: `.text()` reads them as text.\n- They can't be map keys, and `std/format/json` can't write them: `.base64()` can."

