[[modules.items]]
kind = "type"
name = "map"
code = "map"
text = "`map<K, V>`: keys and their values, in the order they were added *(see Map in [builtin_types](https://github.com/Folgue02/lakescript/blob/master/ideas/language/builtin_types.md))*. Verbs change the map itself, past participles return a copy *(i.e. `merge()` and `merged()`)*. Functions passed to the methods get the key and the value."

[[modules.items.groups]]
