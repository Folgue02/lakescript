[[modules.items.members]]
kind = "method"
name = "countBy"
code = "map<K, number> countBy((T) -> K $key)"
text = "How many elements give each `$key` *(i.e. `$words.countBy(($w) -> $w.lower())`)*"
group = "Grouping"

