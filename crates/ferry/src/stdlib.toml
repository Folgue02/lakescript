[[modules.items.members]]
kind = "method"
name = "toString"
code = "string toString()"
text = "`'true'` or `'false'`"
group = "Converting"

[[modules.items]]
kind = "type"
name = "list"
code = "list"
text = "`list<T>`: values in order, starting at index 0 *(see List in [builtin_types](https://github.com/Folgue02/lakescript/blob/master/ideas/language/builtin_types.md))*. Verbs change the list itself, past participles return a copy *(i.e. `sort()` and `sorted()`)*."

[[modules.items.groups]]
name = "Information"

[[modules.items.groups]]
name = "Getting"
text = "`$list[$index]` is the element at `$index`, or `null` outside the list, so `$list[$index] ?? $default` gives a default."

[[modules.items.groups]]
name = "Adding and removing"
text = "These change the list."

[[modules.items.groups]]
name = "Ordering"

[[modules.items.groups]]
name = "Transforming"
text = "These always return a new list."

[[modules.items.groups]]
name = "Grouping"

[[modules.items.groups]]
name = "Searching"

[[modules.items.groups]]
name = "Combining"

[[modules.items.groups]]
name = "Looping"

[[modules.items.members]]
kind = "method"
name = "length"
code = "number length()"
text = "The number of elements"
group = "Information"

[[modules.items.members]]
kind = "method"
name = "empty?"
code = "bool empty?()"
text = "`true` if it has no elements"
group = "Information"

[[modules.items.members]]
kind = "method"
name = "contains"
code = "bool contains(T $value)"
text = "`true` if `$value` is in the list, comparing contents. Same as `-in`"
group = "Information"

[[modules.items.members]]
kind = "method"
name = "indexOf"
code = "?number indexOf(T $value)"
text = "Position of the first `$value`, or `null` *(i.e. `['a', 'b', 'a'].indexOf('a')` is `0`)*"
group = "Information"

[[modules.items.members]]
kind = "method"
name = "indexOfLast"
code = "?number indexOfLast(T $value)"
text = "Position of the last `$value`, or `null`"
group = "Information"

[[modules.items.members]]
kind = "method"
name = "count"
code = "number count(T $value)"
text = "How many times `$value` is in the list"
group = "Information"

[[modules.items.members]]
kind = "method"
name = "countWhere"
code = "number countWhere((T) -> bool $fn)"
text = "How many elements `$fn` returns `true` for *(i.e. `$ages.countWhere(($a) -> $a >= 18)`)*"
group = "Information"

[[modules.items.members]]
kind = "method"
name = "first"
code = "?T first()"
text = "The first element, or `null` if the list is empty"
group = "Getting"

[[modules.items.members]]
kind = "method"
name = "last"
code = "?T last()"
text = "The last element, or `null` if the list is empty"
group = "Getting"

[[modules.items.members]]
kind = "method"
name = "random"
code = "?T random()"
text = "A random element, or `null` if the list is empty"
group = "Getting"

[[modules.items.members]]
kind = "method"
name = "push"
code = "list<T> push(...T $values)"
text = "Adds the values at the end, same as `<<`. Returns the list *(i.e. `$list.push(1, 2)`)*"
group = "Adding and removing"

[[modules.items.members]]
kind = "method"
name = "prepend"
code = "list<T> prepend(...T $values)"
text = "Adds the values at the start. Returns the list"
group = "Adding and removing"

[[modules.items.members]]
kind = "method"
name = "insert"
code = "list<T> insert(number $index, T $value)"
text = "Inserts `$value` at `$index`, moving the rest. Throws an `IndexError` if `$index` is past the end"
group = "Adding and removing"

[[modules.items.members]]
kind = "method"
name = "extend"
code = "list<T> extend(list<T> $other)"
text = "Adds every element of `$other` at the end"
group = "Adding and removing"

[[modules.items.members]]
kind = "method"
name = "removeFirst"
code = "?T removeFirst()"
text = "Removes and returns the first element, or `null` if the list is empty"
group = "Adding and removing"

[[modules.items.members]]
kind = "method"
name = "removeLast"
code = "?T removeLast()"
text = "Removes and returns the last element, or `null` if the list is empty"
group = "Adding and removing"

[[modules.items.members]]
kind = "method"
name = "removeAt"
code = "T removeAt(number $index)"
text = "Removes and returns the element at `$index`. Throws an `IndexError` if it's outside the list"
group = "Adding and removing"

[[modules.items.members]]
kind = "method"
name = "remove"
code = "bool remove(T $value)"
text = "Removes the first `$value`. `true` if it was there"
group = "Adding and removing"

[[modules.items.members]]
kind = "method"
name = "removeAll"
code = "number removeAll(T $value)"
text = "Removes every `$value`, and returns how many there were"
group = "Adding and removing"

[[modules.items.members]]
kind = "method"
name = "removeWhere"
code = "number removeWhere((T) -> bool $fn)"
text = "Removes the elements `$fn` returns `true` for, and returns how many there were"
group = "Adding and removing"

[[modules.items.members]]
kind = "method"
name = "clear"
code = "void clear()"
text = "Removes everything"
group = "Adding and removing"

[[modules.items.members]]
kind = "method"
name = "sort"
code = "list<T> sort()"
text = "Sorts the list from smallest to biggest, using `<`. Returns the list"
group = "Ordering"

[[modules.items.members]]
kind = "method"
name = "sorted"
code = "list<T> sorted()"
text = "A sorted copy"
group = "Ordering"

[[modules.items.members]]
kind = "method"
name = "sortBy"
code = "list<T> sortBy<K>((T) -> K $key)"
text = "Sorts the list by what `$key` returns *(i.e. `$files.sortBy(($f) -> $f.length())`)*"
group = "Ordering"

[[modules.items.members]]
kind = "method"
name = "sortedBy"
code = "list<T> sortedBy<K>((T) -> K $key)"
text = "A copy sorted by what `$key` returns"
group = "Ordering"

[[modules.items.members]]
kind = "method"
name = "sortWith"
code = "list<T> sortWith((T, T) -> number $compare)"
text = "Sorts the list with a comparison function, which returns a negative number if the first value goes first, a positive one if the second does, and `0` if they're equal. For values `<` can't compare, like lists *(i.e. `$words.sortWith(($a, $b) -> $a.length() - $b.length())`)*. To sort by a part of each value, `sortBy` is shorter: `$rows.sortBy(($r) -> $r[0])`. The sort is stable, so equal values keep their order. Returns the list"
group = "Ordering"

[[modules.items.members]]
kind = "method"
name = "sortedWith"
code = "list<T> sortedWith((T, T) -> number $compare)"
text = "A copy sorted with a comparison function"
group = "Ordering"

[[modules.items.members]]
kind = "method"
name = "reverse"
code = "list<T> reverse()"
text = "Reverses the list. Returns the list"
group = "Ordering"

[[modules.items.members]]
kind = "method"
name = "reversed"
code = "list<T> reversed()"
text = "A reversed copy"
group = "Ordering"

[[modules.items.members]]
kind = "method"
name = "shuffle"
code = "list<T> shuffle()"
text = "Puts the elements in random order. Returns the list"
group = "Ordering"

[[modules.items.members]]
kind = "method"
name = "shuffled"
code = "list<T> shuffled()"
text = "A copy in random order"
group = "Ordering"

[[modules.items.members]]
kind = "method"
name = "map"
code = "list<U> map((T) -> U $fn)"
text = "`$fn` applied to every element *(i.e. `$names.map(($n) -> $n.upper())`)*"
group = "Transforming"

[[modules.items.members]]
kind = "method"
name = "filter"
code = "list<T> filter((T) -> bool $fn)"
text = "The elements `$fn` returns `true` for"
group = "Transforming"

[[modules.items.members]]
kind = "method"
name = "reject"
code = "list<T> reject((T) -> bool $fn)"
text = "The elements `$fn` returns `false` for"
group = "Transforming"

[[modules.items.members]]
kind = "method"
name = "flatMap"
code = "list<U> flatMap((T) -> list<U> $fn)"
text = "Like `map`, joining the lists `$fn` returns *(i.e. `$lines.flatMap(($l) -> $l.words())`)*"
group = "Transforming"

[[modules.items.members]]
kind = "method"
name = "flatten"
code = "list<U> flatten()"
text = "For a `list<list<U>>`: joins the lists inside it *(i.e. `[[1, 2], [3]].flatten()` is `[1, 2, 3]`)*. Throws a `TypeError` if an element isn't a list"
group = "Transforming"

[[modules.items.members]]
kind = "method"
name = "unique"
code = "list<T> unique()"
text = "Without repeated values, keeping the first of each *(i.e. `[1, 2, 1].unique()` is `[1, 2]`)*"
group = "Transforming"

[[modules.items.members]]
kind = "method"
name = "uniqueBy"
code = "list<T> uniqueBy<K>((T) -> K $key)"
text = "Without elements with a repeated `$key`"
group = "Transforming"

[[modules.items.members]]
kind = "method"
name = "compact"
code = "list<T> compact()"
text = "Without the `null` values. A `list<?T>` becomes a `list<T>`"
group = "Transforming"

[[modules.items.members]]
kind = "method"
name = "take"
code = "list<T> take(number $count)"
text = "The first `$count` elements, or all of them if there are fewer"
group = "Transforming"

[[modules.items.members]]
kind = "method"
name = "skip"
code = "list<T> skip(number $count)"
text = "Everything but the first `$count` elements"
group = "Transforming"

[[modules.items.members]]
kind = "method"
name = "takeWhile"
code = "list<T> takeWhile((T) -> bool $fn)"
text = "The elements from the start, until `$fn` returns `false`"
group = "Transforming"

[[modules.items.members]]
kind = "method"
name = "skipWhile"
code = "list<T> skipWhile((T) -> bool $fn)"
text = "The elements after the ones at the start that `$fn` returns `true` for"
group = "Transforming"

[[modules.items.members]]
kind = "method"
name = "chunk"
code = "list<list<T>> chunk(number $size)"
text = "Splits it in lists of `$size` elements, the last one can be shorter *(i.e. `[1, 2, 3].chunk(2)` is `[[1, 2], [3]]`)*"
group = "Transforming"

[[modules.items.members]]
kind = "method"
name = "concat"
code = "list<T> concat(list<T> $other)"
text = "This list followed by `$other`"
group = "Transforming"

[[modules.items.members]]
kind = "method"
name = "copy"
code = "list<T> copy()"
text = "A copy of the list. The elements themselves aren't copied"
group = "Transforming"

[[modules.items.members]]
kind = "method"
name = "groupBy"
code = "map<K, list<T>> groupBy((T) -> K $key)"
text = "The elements grouped by what `$key` returns *(i.e. `$files.groupBy(($f) -> $f.afterLast('.'))`)*"
