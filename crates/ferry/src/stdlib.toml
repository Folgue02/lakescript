[[modules.items.members]]
kind = "method"
name = "even?"
code = "bool even?()"
text = "`true` for whole numbers divisible by 2 *(i.e. `4.even?()`)*"
group = "Information"

[[modules.items.members]]
kind = "method"
name = "odd?"
code = "bool odd?()"
text = "`true` for whole numbers not divisible by 2"
group = "Information"

[[modules.items.members]]
kind = "method"
name = "whole?"
code = "bool whole?()"
text = "`true` if it has no decimals *(i.e. `4.0.whole?()` is `true`, `4.5.whole?()` is `false`)*"
group = "Information"

[[modules.items.members]]
kind = "method"
name = "positive?"
code = "bool positive?()"
text = "`true` if it's bigger than 0"
group = "Information"

[[modules.items.members]]
kind = "method"
name = "negative?"
code = "bool negative?()"
text = "`true` if it's smaller than 0"
group = "Information"

[[modules.items.members]]
kind = "method"
name = "zero?"
code = "bool zero?()"
text = "`true` if it's 0"
group = "Information"

[[modules.items.members]]
kind = "method"
name = "nan?"
code = "bool nan?()"
text = "`true` if it's `NaN` *(i.e. `(0 / 0).nan?()`)*"
group = "Information"

[[modules.items.members]]
kind = "method"
name = "infinite?"
code = "bool infinite?()"
text = "`true` if it's `Infinity` or `-Infinity`"
group = "Information"

[[modules.items.members]]
kind = "method"
name = "finite?"
code = "bool finite?()"
text = "`true` if it's neither `NaN` nor infinite"
group = "Information"

[[modules.items.members]]
kind = "method"
name = "between"
code = "bool between(number $min, number $max)"
text = "`true` if it's from `$min` to `$max`, both included *(i.e. `5.between(1, 10)`)*"
group = "Information"

[[modules.items.members]]
kind = "method"
name = "round"
code = "number round(number $decimals = 0)"
text = "Rounds to the nearest, halves away from zero *(i.e. `2.5.round()` is `3`, `3.14159.round(2)` is `3.14`)*"
group = "Rounding"

[[modules.items.members]]
kind = "method"
name = "floor"
code = "number floor()"
text = "Rounds down *(i.e. `2.7.floor()` is `2`, `(-2.1).floor()` is `-3`)*"
group = "Rounding"

[[modules.items.members]]
kind = "method"
name = "ceil"
code = "number ceil()"
text = "Rounds up *(i.e. `2.1.ceil()` is `3`)*"
group = "Rounding"

[[modules.items.members]]
kind = "method"
name = "truncate"
code = "number truncate()"
text = "Removes the decimals *(i.e. `(-2.7).truncate()` is `-2`)*"
group = "Rounding"

[[modules.items.members]]
kind = "method"
name = "abs"
code = "number abs()"
text = "The value without its sign *(i.e. `(-5).abs()` is `5`)*"
group = "Math"

[[modules.items.members]]
kind = "method"
name = "sign"
code = "number sign()"
text = "`-1`, `0` or `1`"
group = "Math"

[[modules.items.members]]
kind = "method"
name = "min"
code = "number min(number $other)"
text = "The smaller of the two *(i.e. `5.min(3)` is `3`)*"
group = "Math"

[[modules.items.members]]
kind = "method"
name = "max"
code = "number max(number $other)"
text = "The bigger of the two"
group = "Math"

[[modules.items.members]]
kind = "method"
name = "clamp"
code = "number clamp(number $min, number $max)"
text = "Keeps it between `$min` and `$max` *(i.e. `150.clamp(0, 100)` is `100`)*"
group = "Math"

[[modules.items.members]]
kind = "method"
name = "div"
code = "number div(number $by)"
text = "Division without decimals, truncated like Java's *(i.e. `7.div(2)` is `3`)*. Throws an `ArithmeticError` if `$by` is 0"
group = "Math"

[[modules.items.members]]
kind = "method"
name = "mod"
code = "number mod(number $by)"
text = "Remainder with the sign of `$by`, unlike `%` *(i.e. `(-1).mod(5)` is `4`, `-1 % 5` is `-1`)*. Useful for wrapping around. Throws an `ArithmeticError` if `$by` is 0"
group = "Math"

[[modules.items.members]]
kind = "method"
name = "sqrt"
code = "number sqrt()"
text = "Square root. Negative numbers give `NaN`"
group = "Math"

[[modules.items.members]]
kind = "method"
name = "log"
code = "number log(?number $base = null)"
text = "Logarithm, natural without a `$base` *(i.e. `100.log(10)` is `2`)*"
group = "Math"

[[modules.items.members]]
kind = "method"
name = "toString"
code = "string toString(number $base = 10)"
text = "*(i.e. `255.toString()` is `'255'`, `255.toString(16)` is `'ff'`, `5.toString(2)` is `'101'`)*. Bases other than 10 only work with whole numbers"
group = "Formatting"

[[modules.items.members]]
kind = "method"
name = "toFixed"
code = "string toFixed(number $decimals)"
text = "Always shows `$decimals` decimals *(i.e. `2.5.toFixed(2)` is `'2.50'`)*"
group = "Formatting"

[[modules.items.members]]
kind = "method"
name = "withSeparators"
code = "string withSeparators(string $separator = ',')"
text = "Groups thousands *(i.e. `1234567.withSeparators()` is `'1,234,567'`)*"
group = "Formatting"

[[modules.items.members]]
kind = "method"
name = "formatBytes"
code = "string formatBytes()"
text = "A size in bytes, readable *(i.e. `1536.formatBytes()` is `'1.5 KB'`, `3_000_000_000.formatBytes()` is `'2.8 GB'`)*"
group = "Formatting"

[[modules.items.members]]
kind = "method"
name = "toChar"
code = "string toChar()"
text = "The character with this Unicode code *(i.e. `65.toChar()` is `'A'`)*"
group = "Formatting"

[[modules.items.members]]
kind = "method"
name = "times"
code = "void times((number) -> void $fn)"
text = "Calls `$fn` this many times, with the count from 0 *(i.e. `3.times(($i) -> outln($i))`)*"
group = "Repeating"

[[modules.items]]
