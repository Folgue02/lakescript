[[modules]]
short = "archive"
path = "std/archive"
title = "std/archive"
text = "Archives: zip, tar and tar.gz, read and written the same way. `use std/archive;`, then `archive::open('site.zip')` or `archive::create('backup.tar.gz')`. The format comes from the name of the file.\n\n```\nuse std/archive;\n\nconst $zip = archive::open('site.zip');\nfor ($entry in $zip.entries()) {\n    outln(f\"{$entry.name}  {$entry.size} bytes\");\n}\noutln($zip.read('docs/notes.txt'));\n$zip.extract('out');\n\nconst $backup = archive::create('backup.tar.gz');\n$backup.add('photos/', as: 'pictures');\n$backup.addText('README.txt', 'My photos');\n$backup.close();\n```"

[[modules.groups]]
name = "Functions"
text = "- The formats, by the end of the name, in any case: `.zip`, `.tar`, and `.tar.gz` or `.tgz` for a tar compressed with gzip."

[[modules.items]]
kind = "function"
name = "open"
code = "Archive open(string $path)"
text = "An archive to read. Throws a `FileNotFound` if it doesn't exist, an `IOError` if it can't be read as its format, and a `ValueError` if its name doesn't say a format"
group = "Functions"

[[modules.items]]
kind = "function"
name = "create"
code = "Archive create(string $path)"
text = "A new archive, written by `close()` with what was added to it, over a file that may be there. Throws a `ValueError` if its name doesn't say a format"
group = "Functions"

[[modules.items]]
kind = "class"
name = "Archive"
code = "class Archive"
text = "From `open()` to read it, or from `create()` to write a new one.\n\n\n\n- Reading methods on an archive from `create()`, adding to one from `open()`, or adding after `close()`, throw a `ValueError` that says which to use.\n- Names use `/` and have no `/` at the end, also for folders *(i.e. `pictures/2026`)*. A name with `..` can't be written, so archives made here can always be extracted.\n- Folders are added with what's in them sorted, so the same files give the same archive.\n- Files keep when they were changed and, on Linux and macOS, their permissions, so scripts in an archive stay runnable."

