[[modules]]
short = "process"
path = "std/process"
title = "std/process"
text = "The script's own process, and running programs. `use std/process;`, then `process::args()`."
notes = "## Platform\n\nThe systems a script can run on, as an enum, so the checker catches a typo and a `switch` has to cover every one. It's a type module of its own, `std/process/Platform`, so `use` gives `Platform` itself *(see type modules in [modules](https://github.com/Folgue02/lakescript/blob/master/ideas/language/modules.md))*, like `Style` in [`std/terminal`](terminal.html):\n\n```\nuse std/process;\nuse std/process/Platform;\n\nconst $opener = switch (process::platform()) {\n    case Platform::MACOS -> 'open';\n    case Platform::WINDOWS -> 'start';\n    case Platform::LINUX -> 'xdg-open';\n};\n```\n\nIts values are `LINUX`, `MACOS` and `WINDOWS`. Other systems like the BSDs are `LINUX`, the closest."

