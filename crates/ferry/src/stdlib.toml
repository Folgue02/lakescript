text = "Commands written with `%x\"...\"` run through the shell *(see Command in [builtin_types](https://github.com/Folgue02/lakescript/blob/master/ideas/language/builtin_types.md))*. These functions are for finding programs, and for running one without a shell.\n\n\n- `exit` needs no `use` *(see [the built-in functions](general.html))*."

