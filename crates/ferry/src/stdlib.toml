[[modules.items]]
kind = "class"
name = "Progress"
code = "class Progress"
text = "A bar or a spinner, from `progress()`.\n\n\n\n- It's drawn on stderr, and only when stderr is a terminal, so a log or a pipe never gets it. It's drawn at most every 40 ms, so a fast loop doesn't slow down for it.\n\n- **No spinner that turns on its own** while the script's code runs *(i.e. `spinner('Downloading', () -> ...)`)*. It would need a thread drawing while the VM runs, which collides with what the script prints, with the commands it runs and with Ctrl+C: a small concurrency system hidden in one function, in a language without concurrency. `progress(null)` turns with each `advance()` instead, which covers loops. For one long call, a line like `Downloading...` is enough. It can come back if the language gets concurrency."

