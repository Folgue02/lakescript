# Builds `lks` and `ferry` for Linux, macOS and Windows when a version tag
# is pushed *(i.e. `v0.7.0`)*, and posts them on the tag's GitHub release.
name: Release

on:
  push:
    tags: ["v*"]
  # Builds the archives without a release, to try the workflow
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl gives static binaries that run on any Linux
          # `test`: the runner can run what it builds, and the tests use `sh`
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, musl: true, test: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, musl: true, test: true }
          - { target: aarch64-apple-darwin, os: macos-latest, test: true }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Test
        if: matrix.test
        shell: bash
        run: cargo test --release --locked --target ${{ matrix.target }}
      - name: Build and pack
        shell: bash
        run: tools/release/package.sh ${{ matrix.target }} ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*${{ matrix.target }}*
      # The page of the standard library is the same for every system: one job posts it
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'x86_64-unknown-linux-musl'
        with:
          name: stdlib-docs
          path: dist/*-stdlib.html

  release:
    name: Post the release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the release with the archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Lakescript $GITHUB_REF_NAME" \
            --generate-notes
