<title>Lakescript Standard Library</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Code+Pro:wght@400;600&display=swap">
<style>
/* Layout: classic javadoc — slate header bar, "All Types" index on the left, summary tables then details on the right. */
:root {
  --bg: #ffffff;
  --fg: #353833;
  --muted: #5f6a73;
  --bar: #4d7a97;
  --bar-fg: #ffffff;
  --head: #dee3e9;
  --row-alt: #eeeeef;
  --rule: #c9d1d9;
  --link: #3e6a8a;
  --link-hover: #bb7a2a;
  --code-bg: #f4f6f8;
  --param: #7a4e14;
  --side: #f8f9fa;
  --font-body: "Source Sans 3", "DejaVu Sans", "Segoe UI", system-ui, sans-serif;
  --font-code: "Source Code Pro", "DejaVu Sans Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15191d; --fg: #d9dee3; --muted: #9aa5ae; --bar: #2f4d63; --bar-fg: #eef3f7;
    --head: #24303a; --row-alt: #1b2126; --rule: #33404b; --link: #8bb8d8; --link-hover: #e8b46c;
    --code-bg: #1e252b; --param: #e0ae6a; --side: #11151a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15191d; --fg: #d9dee3; --muted: #9aa5ae; --bar: #2f4d63; --bar-fg: #eef3f7;
  --head: #24303a; --row-alt: #1b2126; --rule: #33404b; --link: #8bb8d8; --link-hover: #e8b46c;
  --code-bg: #1e252b; --param: #e0ae6a; --side: #11151a; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--font-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bar); }
a { color: var(--link); text-decoration: none; }
a:hover { color: var(--link-hover); text-decoration: underline; }
a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--link-hover); outline-offset: 2px; }
code, pre { font-family: var(--font-code); font-size: 0.9em; }

header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bar); color: var(--bar-fg);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px;
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px;
}
header.top .brand { font-weight: 700; letter-spacing: 0.02em; }
header.top .brand small { font-weight: 400; opacity: 0.8; margin-left: 6px; }
header.top nav { display: flex; gap: 14px; flex-wrap: wrap; }
header.top nav a { color: var(--bar-fg); text-transform: uppercase; font-size: 12px; letter-spacing: 0.08em; font-weight: 600; }
.search { margin-left: auto; position: relative; flex: 0 1 280px; min-width: 0; }
.search input {
  width: 100%; padding: 5px 10px; border: 1px solid transparent; border-radius: 3px;
  background: var(--bg); color: var(--fg); font: inherit; font-size: 14px;
}
.results {
  position: absolute; right: 0; top: calc(100% + 4px); width: min(420px, calc(100vw - 32px));
  max-height: 60vh; overflow-y: auto; background: var(--bg); color: var(--fg);
  border: 1px solid var(--rule); box-shadow: 0 6px 20px rgba(0,0,0,0.18); list-style: none; margin: 0; padding: 4px 0;
}
.results li a { display: block; padding: 5px 12px; color: var(--fg); }
.results li a:hover, .results li a.sel { background: var(--head); text-decoration: none; color: var(--fg); }
.results .rt { color: var(--muted); font-size: 12px; }
.results .rd { display: block; color: var(--muted); font-size: 13px; }

.layout { display: grid; grid-template-columns: 200px minmax(0, 1fr); min-height: 100vh; }
aside.side {
  background: var(--side); border-right: 1px solid var(--rule);
  padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px;
}
aside h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 6px; }
aside ul { list-style: none; margin: 0 0 18px; padding: 0; }
aside li a { display: block; padding: 2px 0; }
aside li a.current { font-weight: 700; color: var(--fg); }
main {
  min-width: 0; padding-block: 20px 60px;
  padding-left: 28px; padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.page, .overview { max-width: 1000px; }
.crumb { font-size: 13px; color: var(--muted); }
h1 { font-size: 26px; margin: 2px 0 14px; font-weight: 600; text-wrap: balance; }
h1 code { font-size: 0.95em; }
.intro p, .overview p, .overview li { max-width: 70ch; }
.intro code, .desc code, .block code, .overview code, .note code { background: var(--code-bg); padding: 0 3px; border-radius: 2px; }
.overview h2 { font-size: 22px; margin: 26px 0 10px; }
.overview h3 { font-size: 17px; margin: 22px 0 8px; }
.overview ul { padding-left: 20px; }
.overview li { margin-bottom: 6px; }
.ref { border-bottom: 1px dotted var(--muted); }

h2.bar {
  background: var(--head); font-size: 16px; font-weight: 600; margin: 28px 0 0; padding: 6px 10px;
  border: 1px solid var(--rule); display: flex; justify-content: space-between; align-items: baseline; gap: 10px;
}
h2.bar .count { font-weight: 400; font-size: 13px; color: var(--muted); }
.tabs { display: flex; flex-wrap: wrap; gap: 2px; padding-top: 8px; }
.tab {
  font: inherit; font-size: 13px; font-weight: 600; border: 0; cursor: pointer; padding: 5px 10px;
  background: var(--head); color: var(--link); border-radius: 3px 3px 0 0;
}
.tab.active { background: var(--bar); color: var(--bar-fg); }
.scroll { overflow-x: auto; }
table.summary { border-collapse: collapse; width: 100%; border: 1px solid var(--rule); }
table.summary th, table.summary td { text-align: left; vertical-align: top; padding: 6px 10px; }
table.summary thead th { background: var(--head); font-size: 13px; font-weight: 600; }
table.summary tbody tr:nth-child(even) td { background: var(--row-alt); }
table.methods td.ret { white-space: nowrap; width: 1%; }
table.methods tr.group th {
  background: var(--bg); border-top: 1px solid var(--rule); font-size: 13px; text-transform: uppercase;
  letter-spacing: 0.07em; color: var(--muted); padding-top: 12px;
}
table.methods tr.group .note { text-transform: none; letter-spacing: 0; font-weight: 400; margin: 4px 0 0; font-size: 14px; }
code.sig { font-size: 14px; }
.mname { font-weight: 600; }
.param { color: var(--param); }
.desc { margin-top: 2px; }

.detail { border-top: 1px solid var(--rule); padding: 10px 0 14px; scroll-margin-top: 60px; }
.detail h4 { margin: 4px 0 6px; font-size: 17px; font-family: var(--font-code); }
.detail:target h4 { color: var(--link-hover); }
pre.decl { background: var(--code-bg); border-left: 3px solid var(--bar); padding: 8px 12px; margin: 0 0 8px; overflow-x: auto; white-space: pre-wrap; }
.block { max-width: 75ch; }
.cat { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
pre.example { background: var(--code-bg); padding: 10px 14px; overflow-x: auto; border-radius: 3px; margin: 10px 0; }
.intro ul, .prose ul, .note ul { padding-left: 20px; max-width: 75ch; }
.intro li, .prose li { margin-bottom: 4px; }
li.nested { margin-left: 20px; list-style: circle; }
.prose { max-width: 1000px; }
.prose table.summary, .intro table.summary { width: auto; margin: 8px 0; }
.prose code, .note code { background: var(--code-bg); padding: 0 3px; border-radius: 2px; }
table.methods tr.group .note p { margin: 4px 0 0; }

@media (max-width: 720px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  aside.side { border-right: 0; border-bottom: 1px solid var(--rule); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  aside ul { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-bottom: 8px; }
  main { padding-left: max(16px, env(safe-area-inset-left, 0px)); }
  .search { flex-basis: 100%; margin-left: 0; }
  table.methods td.ret { white-space: normal; }
}
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>

<header class="top">
  <div class="brand">Lakescript <small>Standard Library · sketch</small></div>
  <nav aria-label="Main">
    <a href="#overview">Overview</a>
    <a href="#string">Types</a>
    <a href="#fs">Modules</a>
  </nav>
  <div class="search">
    <label for="q" hidden>Search methods</label>
    <input id="q" type="search" placeholder="Search {{TOTAL}} methods…" autocomplete="off">
    <ul class="results" id="results" hidden></ul>
  </div>
</header>

<div class="layout">
  <aside class="side">
    <h2>Overview</h2>
    <ul><li><a href="#overview" data-nav="overview">Philosophy and conventions</a></li></ul>
    <h2>Types</h2>
    <ul>{{NAV}}</ul>
    <h2>Modules</h2>
    <ul>{{NAV_MODULES}}</ul>
  </aside>
  <main id="main">
    <article class="overview page" data-page="overview">
      <div class="crumb">lakescript</div>
      <h1>Standard Library</h1>
      {{OVERVIEW}}
    </article>
    {{PAGES}}
  </main>
</div>

<script>
const INDEX = {{INDEX}};
const pages = [...document.querySelectorAll('[data-page]')];

function show(name) {
  pages.forEach(p => { p.hidden = p.dataset.page !== name; });
  document.querySelectorAll('[data-nav]').forEach(a => a.classList.toggle('current', a.dataset.nav === name));
}

function route() {
  const hash = decodeURIComponent(location.hash.slice(1));
  if (!hash || hash === 'overview') { show('overview'); window.scrollTo(0, 0); return; }
  const page = pages.find(p => p.dataset.page === hash);
  if (page) { show(hash); window.scrollTo(0, 0); return; }
  const target = document.getElementById(hash);
  if (target) {
    const parent = target.closest('[data-page]');
    show(parent.dataset.page);
    requestAnimationFrame(() => target.scrollIntoView({ block: 'start' }));
    return;
  }
  show('overview');
}
window.addEventListener('hashchange', route);
route();

// Group tabs, like javadoc's "All Methods / Instance Methods" tabs
document.querySelectorAll('.page').forEach(page => {
  const tabs = page.querySelectorAll('.tab');
  tabs.forEach(tab => tab.addEventListener('click', () => {
    tabs.forEach(t => t.classList.toggle('active', t === tab));
    const cat = tab.dataset.cat;
    page.querySelectorAll('table.methods tbody tr').forEach(tr => {
      tr.hidden = cat !== 'all' && tr.dataset.cat !== cat;
    });
  }));
});

// Search
const q = document.getElementById('q');
const results = document.getElementById('results');
let sel = -1;
function esc(s) { return s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function search() {
  const term = q.value.trim().toLowerCase();
  sel = -1;
  if (!term) { results.hidden = true; results.innerHTML = ''; return; }
  const hits = INDEX.filter(e => e.m.toLowerCase().includes(term) || (e.t + '.' + e.m).toLowerCase().includes(term))
    .sort((a, b) => (a.m.toLowerCase().startsWith(term) ? 0 : 1) - (b.m.toLowerCase().startsWith(term) ? 0 : 1))
    .slice(0, 40);
  results.innerHTML = hits.length
    ? hits.map(e => `<li><a href="#${e.a}"><code>${esc(e.m)}()</code> <span class="rt">in ${esc(e.t)}</span><span class="rd">${esc(e.d)}</span></a></li>`).join('')
    : '<li><a>No methods match</a></li>';
  results.hidden = false;
}
q.addEventListener('input', search);
q.addEventListener('keydown', ev => {
  const links = [...results.querySelectorAll('a[href]')];
  if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
    ev.preventDefault();
    sel = Math.max(0, Math.min(links.length - 1, sel + (ev.key === 'ArrowDown' ? 1 : -1)));
    links.forEach((l, i) => l.classList.toggle('sel', i === sel));
  } else if (ev.key === 'Enter' && links.length) {
    location.hash = links[Math.max(sel, 0)].getAttribute('href').slice(1);
    results.hidden = true; q.blur();
  } else if (ev.key === 'Escape') { results.hidden = true; }
});
results.addEventListener('click', () => { results.hidden = true; });
document.addEventListener('click', ev => { if (!ev.target.closest('.search')) results.hidden = true; });
</script>
