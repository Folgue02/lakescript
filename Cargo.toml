[workspace]
resolver = "3"
members = ["crates/lakescript", "crates/lks", "crates/ferry", "crates/lks-lsp"]

[workspace.package]
version = "0.11.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
lakescript = { path = "crates/lakescript" }

# The interpreter walks the syntax tree with Rust's stack. Unoptimized
# builds use several times more stack per nested expression, so the
# language crate is lightly optimized even in debug builds.
[profile.dev.package.lakescript]
opt-level = 1

# Releases: slower to build, and the VM is about 5 to 15% faster. A panic, a
# bug of Lakescript itself, stops the program at once instead of unwinding.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
